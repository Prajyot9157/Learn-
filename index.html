<!DOCTYPE html>
<html lang="en" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JEE Main 2027 Interactive Planner</title>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        navy: '#0b1a40',
                        royal: '#1c58c4',
                        chem: '#1c8144',
                        math: '#592e83',
                    },
                    animation: {
                        'pulse-fast': 'pulse 1.5s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                        'bounce-in': 'bounceIn 0.5s ease-out',
                    },
                    keyframes: {
                        bounceIn: {
                            '0%': { transform: 'scale(0.9)', opacity: '0' },
                            '50%': { transform: 'scale(1.02)' },
                            '100%': { transform: 'scale(1)', opacity: '1' },
                        }
                    }
                }
            }
        }
    </script>

    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Lucide Icons & Chart.js -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-gray-50 dark:bg-gray-900 text-gray-800 dark:text-gray-100 transition-colors duration-200 font-sans">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;

        // --- DATA ---
        const SYLLABUS_DATA = {
            physics: [
                "Units and Measurements", "Kinematics", "Laws of Motion", "Work Energy and Power", "Rotational Motion", 
                "Gravitation", "Properties of Solids and Liquids", "Thermodynamics", "Kinetic Theory of Gases", 
                "Oscillations and Waves", "Electrostatics", "Current Electricity", "Magnetism", "Electromagnetic Induction and AC", 
                "Electromagnetic Waves", "Optics", "Dual Nature of Matter", "Atoms and Nuclei", "Electronic Devices", "Experimental Skills"
            ],
            chemistry: [
                "Some Basic Concepts", "Atomic Structure", "Chemical Bonding", "Chemical Thermodynamics", "Solutions", 
                "Equilibrium", "Redox Reactions and Electrochemistry", "Chemical Kinetics", "Classification of Elements", 
                "p-Block Elements", "d- and f-Block Elements", "Coordination Compounds", "Purification and Characterisation", 
                "General Organic Chemistry", "Hydrocarbons", "Organic Compounds with Halogens", "Oxygen-containing Organics", 
                "Nitrogen-containing Organics", "Biomolecules", "Practical Chemistry"
            ],
            maths: [
                "Sets, Relations and Functions", "Complex Numbers", "Matrices and Determinants", "Permutations and Combinations", 
                "Binomial Theorem", "Sequences and Series", "Limits, Continuity and Differentiability", "Integral Calculus", 
                "Differential Equations", "Coordinate Geometry (2D)", "Three-Dimensional Geometry", "Vector Algebra", 
                "Statistics and Probability", "Trigonometry"
            ]
        };

        // Generate 60 day plan with individual task tracking
        const generatePlan = () => {
            const plan = {};
            for (let i = 1; i <= 60; i++) {
                let pTask = "", cTask = "", mTask = "";
                let phase = "";
                
                if (i <= 10) {
                    phase = "Foundations";
                    pTask = SYLLABUS_DATA.physics[Math.floor(i/2.5)] || "Basic Concepts";
                    cTask = SYLLABUS_DATA.chemistry[Math.floor(i/2.5)] || "Basic Concepts";
                    mTask = SYLLABUS_DATA.maths[Math.floor(i/2.5)] || "Basic Concepts";
                } else if (i <= 20) {
                    phase = "Core Concepts";
                    pTask = SYLLABUS_DATA.physics[Math.floor(i/2)];
                    cTask = SYLLABUS_DATA.chemistry[Math.floor(i/2)];
                    mTask = SYLLABUS_DATA.maths[Math.floor(i/2)];
                } else if (i <= 30) {
                    phase = "Electricity, Organic & Calculus";
                    pTask = SYLLABUS_DATA.physics[Math.floor(i/1.5)];
                    cTask = SYLLABUS_DATA.chemistry[Math.floor(i/1.5)];
                    mTask = SYLLABUS_DATA.maths[Math.floor(i/1.5)];
                } else if (i <= 40) {
                    phase = "Major Remaining Topics";
                    pTask = SYLLABUS_DATA.physics[i-20] || "Revise";
                    cTask = SYLLABUS_DATA.chemistry[i-20] || "Revise";
                    mTask = SYLLABUS_DATA.maths[i-25] || "Revise";
                } else if (i <= 50) {
                    phase = "Remaining Topics & PYQs";
                    pTask = "PYQs & Practice"; cTask = "PYQs & Practice"; mTask = "PYQs & Practice";
                } else {
                    phase = "Revision & Mock Tests";
                    pTask = "Revision / Mock Test"; cTask = "Revision / Mock Test"; mTask = "Revision / Mock Test";
                }

                plan[i] = { 
                    physics: pTask || "NA", 
                    chemistry: cTask || "NA", 
                    maths: mTask || "NA", 
                    phase,
                    status: "pending", 
                    tasks: { physics: false, chemistry: false, maths: false } // Individual task tracking
                };
            }
            return plan;
        };

        // --- UTILITIES ---
        const useLocalStorage = (key, initialValue) => {
            const [storedValue, setStoredValue] = useState(() => {
                try {
                    const item = window.localStorage.getItem(key);
                    return item ? JSON.parse(item) : initialValue;
                } catch (error) {
                    return initialValue;
                }
            });

            const setValue = (value) => {
                try {
                    const valueToStore = value instanceof Function ? value(storedValue) : value;
                    setStoredValue(valueToStore);
                    window.localStorage.setItem(key, JSON.stringify(valueToStore));
                } catch (error) { console.error(error); }
            };
            return [storedValue, setValue];
        };

        // --- COMPONENTS ---
        
        // 1. Header & Navigation
        const Header = ({ activeTab, setActiveTab, isDark, toggleDark }) => {
            const tabs = [
                { id: 'dashboard', label: 'Dashboard', icon: 'LayoutDashboard' },
                { id: 'calendar', label: '60-Day Plan', icon: 'Calendar' },
                { id: 'syllabus', label: 'Syllabus', icon: 'BookOpen' },
                { id: 'revision', label: 'Mistakes', icon: 'AlertCircle' },
                { id: 'mocks', label: 'Mock Tests', icon: 'BarChart2' },
                { id: 'timer', label: 'Timer', icon: 'Timer' },
            ];

            return (
                <nav className="bg-white/90 dark:bg-gray-800/90 backdrop-blur-md shadow-sm sticky top-0 z-50 border-b border-gray-100 dark:border-gray-700">
                    <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                        <div className="flex justify-between h-16">
                            <div className="flex items-center cursor-pointer" onClick={() => setActiveTab('dashboard')}>
                                <span className="text-xl font-extrabold text-navy dark:text-white flex items-center gap-2 tracking-tight">
                                    <div className="bg-royal text-white p-1.5 rounded-lg"><i data-lucide="target" size={20}></i></div>
                                    JEE 2027
                                </span>
                            </div>
                            <div className="hidden md:flex items-center space-x-1">
                                {tabs.map(tab => (
                                    <button
                                        key={tab.id}
                                        onClick={() => setActiveTab(tab.id)}
                                        className={`px-3 py-2 rounded-lg text-sm font-semibold flex items-center gap-2 transition-all ${
                                            activeTab === tab.id 
                                            ? 'bg-blue-50 text-royal dark:bg-gray-700 dark:text-blue-400' 
                                            : 'text-gray-500 hover:bg-gray-100 dark:text-gray-400 dark:hover:bg-gray-700'
                                        }`}
                                    >
                                        <i data-lucide={tab.icon} size={16}></i> {tab.label}
                                    </button>
                                ))}
                                <div className="w-px h-6 bg-gray-200 dark:bg-gray-700 mx-2"></div>
                                <button onClick={toggleDark} className="p-2 text-gray-500 hover:bg-gray-100 rounded-full dark:text-gray-300 dark:hover:bg-gray-700 transition-colors">
                                    <i data-lucide={isDark ? 'Sun' : 'Moon'} size={20}></i>
                                </button>
                            </div>
                        </div>
                    </div>
                    {/* Mobile Nav */}
                    <div className="md:hidden flex overflow-x-auto px-2 py-2 border-t border-gray-100 dark:border-gray-700 no-scrollbar">
                        {tabs.map(tab => (
                            <button
                                key={tab.id}
                                onClick={() => setActiveTab(tab.id)}
                                className={`flex-shrink-0 px-3 py-1.5 rounded-full text-xs font-semibold flex items-center gap-1.5 mx-1 transition-colors ${
                                    activeTab === tab.id ? 'bg-royal text-white' : 'text-gray-600 bg-gray-100 dark:bg-gray-800 dark:text-gray-300'
                                }`}
                            >
                                <i data-lucide={tab.icon} size={14}></i> {tab.label}
                            </button>
                        ))}
                        <button onClick={toggleDark} className="flex-shrink-0 px-3 py-1.5 rounded-full text-xs font-semibold flex items-center gap-1 mx-1 text-gray-600 bg-gray-100 dark:bg-gray-800 dark:text-gray-300">
                            <i data-lucide={isDark ? 'Sun' : 'Moon'} size={14}></i> Theme
                        </button>
                    </div>
                </nav>
            );
        };

        // 2. Interactive Task Card for Dashboard
        const ActionTaskCard = ({ subject, chapter, isCompleted, onToggle }) => {
            // Styling based on subject
            const styles = {
                physics: { color: 'text-royal', bg: 'bg-blue-50 dark:bg-blue-900/20', border: 'border-blue-200 dark:border-blue-800', icon: 'Atom' },
                chemistry: { color: 'text-chem', bg: 'bg-green-50 dark:bg-green-900/20', border: 'border-green-200 dark:border-green-800', icon: 'FlaskConical' },
                maths: { color: 'text-math', bg: 'bg-purple-50 dark:bg-purple-900/20', border: 'border-purple-200 dark:border-purple-800', icon: 'Calculator' },
            }[subject];

            return (
                <div 
                    onClick={onToggle}
                    className={`cursor-pointer group relative overflow-hidden rounded-2xl p-5 border-2 transition-all duration-300 ${
                        isCompleted 
                        ? 'bg-gray-50 border-gray-200 opacity-60 dark:bg-gray-800 dark:border-gray-700' 
                        : `${styles.bg} ${styles.border} hover:shadow-md hover:-translate-y-1`
                    }`}
                >
                    <div className="flex items-start justify-between mb-4">
                        <div className={`p-2 rounded-xl bg-white dark:bg-gray-800 shadow-sm ${styles.color}`}>
                            <i data-lucide={styles.icon} size={24}></i>
                        </div>
                        {/* Custom Big Checkbox */}
                        <div className={`w-8 h-8 rounded-full border-2 flex items-center justify-center transition-colors ${
                            isCompleted 
                            ? 'bg-green-500 border-green-500 text-white' 
                            : 'border-gray-300 text-transparent group-hover:border-gray-400 bg-white dark:bg-gray-800'
                        }`}>
                            <i data-lucide="check" size={18} className={isCompleted ? 'opacity-100' : 'opacity-0'}></i>
                        </div>
                    </div>
                    
                    <div>
                        <p className={`text-xs font-bold uppercase tracking-wider mb-1 ${isCompleted ? 'text-gray-400' : styles.color}`}>
                            {subject}
                        </p>
                        <h3 className={`text-lg font-bold leading-tight ${isCompleted ? 'line-through text-gray-400' : 'text-gray-800 dark:text-white'}`}>
                            {chapter}
                        </h3>
                    </div>
                </div>
            );
        };

        // 3. Dashboard (The Action Center)
        const Dashboard = ({ plan, chapters, settings, toggleTask, completeDay, setActiveTab }) => {
            // Calculate overall progress
            const totalChapters = Object.keys(chapters.physics).length + Object.keys(chapters.chemistry).length + Object.keys(chapters.maths).length;
            const completedChapters = Object.values(chapters).reduce((acc, sub) => acc + Object.values(sub).filter(c => c.completed).length, 0);
            const overallProgress = Math.round((completedChapters / totalChapters) * 100) || 0;

            // Find current day (first day that is not fully completed)
            const currentDayNum = parseInt(Object.keys(plan).find(day => plan[day].status !== 'completed')) || 60;
            const currentDay = plan[currentDayNum];
            
            // Fallback for older localstorage data
            const tasks = currentDay.tasks || { physics: false, chemistry: false, maths: false };
            const completedTasksCount = Object.values(tasks).filter(Boolean).length;
            const isDayFullyDone = completedTasksCount === 3;

            const daysLeft = Math.max(0, Math.ceil((new Date(settings.targetDate) - new Date()) / (1000 * 60 * 60 * 24)));

            return (
                <div className="space-y-8 animate-fade-in pb-10">
                    
                    {/* TOP HERO SECTION: TODAY'S FOCUS */}
                    <div className="relative bg-navy rounded-3xl p-6 sm:p-10 shadow-2xl overflow-hidden border border-gray-800">
                        {/* Background Decoration */}
                        <div className="absolute top-0 right-0 -mr-20 -mt-20 w-64 h-64 bg-royal rounded-full blur-3xl opacity-20"></div>
                        <div className="absolute bottom-0 left-0 -ml-20 -mb-20 w-64 h-64 bg-chem rounded-full blur-3xl opacity-10"></div>
                        
                        <div className="relative z-10">
                            <div className="flex flex-col md:flex-row justify-between items-start md:items-center mb-8 gap-4 border-b border-gray-700/50 pb-6">
                                <div>
                                    <div className="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-blue-500/20 text-blue-300 text-xs font-bold tracking-wide uppercase mb-3">
                                        <i data-lucide="zap" size={14}></i> Phase: {currentDay.phase}
                                    </div>
                                    <h1 className="text-3xl sm:text-4xl font-extrabold text-white tracking-tight">
                                        Day {currentDayNum} Focus
                                    </h1>
                                    <p className="text-gray-400 mt-2 text-sm sm:text-base">Tick off your targets below to conquer today.</p>
                                </div>
                                
                                <div className="bg-gray-800/80 backdrop-blur-sm px-5 py-3 rounded-2xl border border-gray-700 text-center">
                                    <p className="text-xs text-gray-400 uppercase tracking-wider mb-1">Days Left</p>
                                    <p className="text-2xl font-bold text-white">{daysLeft}</p>
                                </div>
                            </div>

                            {/* Interactive Task Grid */}
                            <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                                <ActionTaskCard 
                                    subject="physics" 
                                    chapter={currentDay.physics} 
                                    isCompleted={tasks.physics} 
                                    onToggle={() => toggleTask(currentDayNum, 'physics')} 
                                />
                                <ActionTaskCard 
                                    subject="chemistry" 
                                    chapter={currentDay.chemistry} 
                                    isCompleted={tasks.chemistry} 
                                    onToggle={() => toggleTask(currentDayNum, 'chemistry')} 
                                />
                                <ActionTaskCard 
                                    subject="maths" 
                                    chapter={currentDay.maths} 
                                    isCompleted={tasks.maths} 
                                    onToggle={() => toggleTask(currentDayNum, 'maths')} 
                                />
                            </div>

                            {/* Complete Day Action */}
                            <div className="mt-8 flex flex-col sm:flex-row items-center justify-between gap-4 bg-gray-800/50 p-4 rounded-xl border border-gray-700/50">
                                <div className="flex items-center gap-3">
                                    <div className="flex -space-x-2">
                                        {[1,2,3].map(i => (
                                            <div key={i} className={`w-8 h-8 rounded-full border-2 border-navy flex items-center justify-center ${completedTasksCount >= i ? 'bg-green-500 text-white' : 'bg-gray-700 text-gray-500'}`}>
                                                {completedTasksCount >= i ? <i data-lucide="check" size={14}></i> : <span className="text-xs font-bold">{i}</span>}
                                            </div>
                                        ))}
                                    </div>
                                    <span className="text-sm font-medium text-gray-300 ml-2">
                                        {isDayFullyDone ? "All tasks completed! Great job." : `${completedTasksCount} of 3 targets completed`}
                                    </span>
                                </div>
                                <button 
                                    onClick={() => completeDay(currentDayNum)}
                                    disabled={!isDayFullyDone}
                                    className={`w-full sm:w-auto px-6 py-3 rounded-xl font-bold text-sm transition-all duration-300 ${
                                        isDayFullyDone 
                                        ? 'bg-green-500 hover:bg-green-600 text-white shadow-lg shadow-green-500/30' 
                                        : 'bg-gray-700 text-gray-400 cursor-not-allowed'
                                    }`}
                                >
                                    Complete Day {currentDayNum} & Move to Next
                                </button>
                            </div>
                        </div>
                    </div>

                    {/* OVERALL STATS */}
                    <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                        <div className="bg-white dark:bg-gray-800 p-6 rounded-2xl shadow-sm border border-gray-100 dark:border-gray-700 flex items-center gap-5">
                            <div className="p-4 bg-blue-50 dark:bg-blue-900/30 text-royal rounded-2xl"><i data-lucide="award" size={28}></i></div>
                            <div>
                                <p className="text-sm font-medium text-gray-500 dark:text-gray-400">Syllabus Completion</p>
                                <p className="text-3xl font-extrabold text-gray-800 dark:text-white">{overallProgress}%</p>
                            </div>
                        </div>
                        <div className="bg-white dark:bg-gray-800 p-6 rounded-2xl shadow-sm border border-gray-100 dark:border-gray-700 flex items-center gap-5">
                            <div className="p-4 bg-orange-50 dark:bg-orange-900/30 text-orange-500 rounded-2xl"><i data-lucide="flame" size={28}></i></div>
                            <div>
                                <p className="text-sm font-medium text-gray-500 dark:text-gray-400">Current Streak</p>
                                <p className="text-3xl font-extrabold text-gray-800 dark:text-white">{currentDayNum - 1} <span className="text-sm font-medium text-gray-400">Days</span></p>
                            </div>
                        </div>
                        <div className="bg-white dark:bg-gray-800 p-6 rounded-2xl shadow-sm border border-gray-100 dark:border-gray-700 flex items-center gap-5 cursor-pointer hover:border-royal transition-colors" onClick={() => setActiveTab('mocks')}>
                            <div className="p-4 bg-green-50 dark:bg-green-900/30 text-chem rounded-2xl"><i data-lucide="trending-up" size={28}></i></div>
                            <div>
                                <p className="text-sm font-medium text-gray-500 dark:text-gray-400">Next Step</p>
                                <p className="text-lg font-bold text-royal dark:text-blue-400 mt-0.5">Take a Mock Test →</p>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        // 4. Calendar
        const CalendarView = ({ plan, updatePlanStatus }) => {
            return (
                <div className="space-y-6 animate-fade-in">
                    <div className="flex justify-between items-center">
                        <h1 className="text-2xl font-bold">60-Day Overview</h1>
                    </div>
                    
                    <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-4">
                        {Object.entries(plan).map(([day, data]) => (
                            <div key={day} className={`bg-white dark:bg-gray-800 rounded-xl p-4 shadow-sm border ${data.status === 'completed' ? 'border-green-500 bg-green-50/30' : data.status === 'difficult' ? 'border-orange-500 bg-orange-50/30' : 'border-gray-200 dark:border-gray-700'}`}>
                                <div className="flex justify-between items-start mb-2">
                                    <div>
                                        <span className="text-xs font-bold text-gray-400 uppercase tracking-wider">Day {day}</span>
                                        <h3 className="font-bold text-sm leading-tight mt-1 text-gray-800 dark:text-gray-200">{data.phase}</h3>
                                    </div>
                                    {data.status === 'completed' && <i data-lucide="check-circle" className="text-green-500" size={20}></i>}
                                    {data.status === 'difficult' && <i data-lucide="alert-circle" className="text-orange-500" size={20}></i>}
                                </div>
                                
                                <div className="space-y-2 mt-4 text-xs">
                                    <div className="flex items-start gap-2">
                                        <div className="w-1.5 h-1.5 rounded-full bg-royal mt-1"></div>
                                        <span className="flex-1 text-gray-600 dark:text-gray-400 line-clamp-2">{data.physics}</span>
                                    </div>
                                    <div className="flex items-start gap-2">
                                        <div className="w-1.5 h-1.5 rounded-full bg-chem mt-1"></div>
                                        <span className="flex-1 text-gray-600 dark:text-gray-400 line-clamp-2">{data.chemistry}</span>
                                    </div>
                                    <div className="flex items-start gap-2">
                                        <div className="w-1.5 h-1.5 rounded-full bg-math mt-1"></div>
                                        <span className="flex-1 text-gray-600 dark:text-gray-400 line-clamp-2">{data.maths}</span>
                                    </div>
                                </div>

                                <div className="mt-3 pt-3 border-t border-gray-100 dark:border-gray-700 flex justify-between gap-1">
                                    <button 
                                        onClick={() => updatePlanStatus(day, data.status === 'completed' ? 'pending' : 'completed')}
                                        className={`flex-1 py-1.5 rounded text-[10px] font-bold transition-colors ${
                                            data.status === 'completed' ? 'bg-gray-100 text-gray-600' : 'bg-green-500 text-white hover:bg-green-600'
                                        }`}
                                    >
                                        {data.status === 'completed' ? 'Undo' : 'Done'}
                                    </button>
                                    <button 
                                        onClick={() => updatePlanStatus(day, data.status === 'difficult' ? 'pending' : 'difficult')}
                                        className={`px-2 py-1.5 rounded border ${
                                            data.status === 'difficult' ? 'bg-orange-100 border-orange-300 text-orange-700' : 'border-gray-200 text-gray-400 hover:bg-gray-50'
                                        }`}
                                        title="Flag as Difficult"
                                    >
                                        <i data-lucide="flag" size={12}></i>
                                    </button>
                                </div>
                            </div>
                        ))}
                    </div>
                </div>
            );
        };

        // 5. Syllabus
        const SyllabusView = ({ chapters, updateChapter }) => {
            const [activeSub, setActiveSub] = useState('physics');
            const [search, setSearch] = useState('');

            const filteredChapters = Object.entries(chapters[activeSub]).filter(([id, data]) => 
                data.name.toLowerCase().includes(search.toLowerCase())
            );

            return (
                <div className="space-y-6 animate-fade-in">
                    <div className="flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                        <h1 className="text-2xl font-bold">Syllabus Tracker</h1>
                        <div className="relative w-full md:w-64">
                            <i data-lucide="search" className="absolute left-3 top-2.5 text-gray-400" size={16}></i>
                            <input 
                                type="text" placeholder="Search chapters..." value={search} onChange={(e) => setSearch(e.target.value)}
                                className="w-full pl-9 pr-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-royal dark:bg-gray-800 dark:border-gray-700 text-sm"
                            />
                        </div>
                    </div>

                    <div className="flex gap-2 border-b border-gray-200 dark:border-gray-700 pb-2 overflow-x-auto">
                        {['physics', 'chemistry', 'maths'].map(sub => (
                            <button key={sub} onClick={() => setActiveSub(sub)}
                                className={`px-4 py-2 font-bold text-sm rounded-t-lg transition-colors capitalize whitespace-nowrap ${
                                    activeSub === sub ? 'bg-royal text-white' : 'text-gray-500 hover:text-royal'
                                }`}
                            >
                                {sub === 'maths' ? 'Mathematics' : sub}
                            </button>
                        ))}
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                        {filteredChapters.length === 0 ? (
                            <div className="col-span-full text-center py-10 text-gray-500">No chapters found.</div>
                        ) : (
                            filteredChapters.map(([id, data]) => (
                                <div key={id} className={`bg-white dark:bg-gray-800 p-5 rounded-xl border ${data.completed ? 'border-green-300 bg-green-50/20' : 'border-gray-200 dark:border-gray-700'}`}>
                                    <div className="flex justify-between items-start mb-4">
                                        <div>
                                            <h3 className={`font-bold text-lg ${data.completed ? 'text-gray-400 line-through' : ''}`}>{data.name}</h3>
                                            <span className={`text-[10px] px-2 py-0.5 rounded-full font-bold uppercase tracking-wide ${data.priority === 'High' ? 'bg-red-100 text-red-700' : 'bg-gray-100 text-gray-700'}`}>
                                                {data.priority} Priority
                                            </span>
                                        </div>
                                        <input type="checkbox" checked={data.completed} onChange={(e) => updateChapter(activeSub, id, 'completed', e.target.checked)}
                                            className="w-6 h-6 rounded text-royal focus:ring-royal cursor-pointer border-gray-300" />
                                    </div>
                                    
                                    <div className="space-y-3 text-sm">
                                        <div className="flex items-center justify-between gap-4">
                                            <span className="text-gray-600 dark:text-gray-400 text-xs font-medium w-24">Theory</span>
                                            <input type="range" min="0" max="100" value={data.theory} onChange={(e) => updateChapter(activeSub, id, 'theory', parseInt(e.target.value))} className="flex-1 accent-royal h-1.5" />
                                            <span className="text-xs font-bold w-8 text-right">{data.theory}%</span>
                                        </div>
                                        <div className="flex items-center justify-between gap-4">
                                            <span className="text-gray-600 dark:text-gray-400 text-xs font-medium w-24">PYQ Practice</span>
                                            <input type="range" min="0" max="100" value={data.pyq} onChange={(e) => updateChapter(activeSub, id, 'pyq', parseInt(e.target.value))} className="flex-1 accent-royal h-1.5" />
                                            <span className="text-xs font-bold w-8 text-right">{data.pyq}%</span>
                                        </div>
                                    </div>
                                </div>
                            ))
                        )}
                    </div>
                </div>
            );
        };

        // 6. Revision (Mistake Tracker)
        const RevisionTracker = ({ mistakes, addMistake, resolveMistake }) => {
            const [form, setForm] = useState({ chapter: '', mistake: '', concept: '' });

            const handleSubmit = (e) => {
                e.preventDefault();
                if(!form.chapter || !form.mistake) return;
                addMistake({ ...form, id: Date.now(), resolved: false, date: new Date().toISOString() });
                setForm({ chapter: '', mistake: '', concept: '' });
            };

            return (
                <div className="space-y-6 animate-fade-in">
                    <h1 className="text-2xl font-bold">Mistake Tracker</h1>
                    
                    <div className="bg-white dark:bg-gray-800 p-6 rounded-xl border border-gray-200 dark:border-gray-700">
                        <h2 className="font-bold mb-4">Log a Mistake</h2>
                        <form onSubmit={handleSubmit} className="space-y-4">
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                <input required type="text" placeholder="Chapter Name (e.g., Kinematics)" value={form.chapter} onChange={e => setForm({...form, chapter: e.target.value})} className="p-2.5 border rounded-lg dark:bg-gray-700 dark:border-gray-600 w-full text-sm" />
                                <input required type="text" placeholder="Correct Concept / Formula" value={form.concept} onChange={e => setForm({...form, concept: e.target.value})} className="p-2.5 border rounded-lg dark:bg-gray-700 dark:border-gray-600 w-full text-sm" />
                            </div>
                            <textarea required placeholder="Describe the mistake (e.g., Forgot to convert units to SI)" value={form.mistake} onChange={e => setForm({...form, mistake: e.target.value})} className="p-2.5 border rounded-lg dark:bg-gray-700 dark:border-gray-600 w-full h-20 text-sm"></textarea>
                            <button type="submit" className="bg-royal text-white px-6 py-2.5 rounded-lg font-bold text-sm hover:bg-blue-700 transition-colors">Save to Tracker</button>
                        </form>
                    </div>

                    <div className="grid grid-cols-1 gap-4">
                        {mistakes.length === 0 && <p className="text-gray-500 text-center py-8 text-sm">No mistakes logged yet. Keep practicing!</p>}
                        {mistakes.map(m => (
                            <div key={m.id} className={`p-5 rounded-xl border transition-all ${m.resolved ? 'bg-gray-50 border-gray-200 opacity-60' : 'bg-white dark:bg-gray-800 border-red-200 shadow-sm'}`}>
                                <div className="flex justify-between items-start gap-4">
                                    <div>
                                        <span className="text-xs font-bold text-red-500 uppercase tracking-wide">{m.chapter}</span>
                                        <p className={`font-medium mt-1 text-gray-800 dark:text-gray-200 ${m.resolved ? 'line-through' : ''}`}>{m.mistake}</p>
                                        <p className="text-sm text-gray-500 mt-2 bg-gray-50 dark:bg-gray-700/50 p-2 rounded inline-block"><strong className="text-gray-700 dark:text-gray-300">Concept:</strong> {m.concept}</p>
                                    </div>
                                    <button onClick={() => resolveMistake(m.id)}
                                        className={`px-4 py-2 rounded-lg text-xs font-bold whitespace-nowrap ${m.resolved ? 'bg-gray-200 text-gray-600' : 'bg-green-100 text-green-700 hover:bg-green-200'}`}>
                                        {m.resolved ? 'Resolved' : 'Mark Resolved'}
                                    </button>
                                </div>
                            </div>
                        ))}
                    </div>
                </div>
            );
        };

        // 7. Mock Tests
        const MockTests = ({ mocks, addMock }) => {
            const [form, setForm] = useState({ name: '', physics: '', chemistry: '', maths: '' });
            const chartRef = useRef(null);
            const chartInstance = useRef(null);

            const handleSubmit = (e) => {
                e.preventDefault();
                const p = parseInt(form.physics) || 0;
                const c = parseInt(form.chemistry) || 0;
                const m = parseInt(form.maths) || 0;
                addMock({ ...form, id: Date.now(), total: p+c+m, date: new Date().toLocaleDateString() });
                setForm({ name: '', physics: '', chemistry: '', maths: '' });
            };

            useEffect(() => {
                if (chartRef.current && mocks.length > 0) {
                    if (chartInstance.current) chartInstance.current.destroy();
                    const ctx = chartRef.current.getContext('2d');
                    chartInstance.current = new Chart(ctx, {
                        type: 'line',
                        data: {
                            labels: mocks.map(m => m.name),
                            datasets: [{
                                label: 'Total Score (Out of 300)',
                                data: mocks.map(m => m.total),
                                borderColor: '#1c58c4',
                                backgroundColor: 'rgba(28, 88, 196, 0.1)',
                                tension: 0.3, fill: true, pointBackgroundColor: '#0b1a40', pointRadius: 4
                            }]
                        },
                        options: { responsive: true, maintainAspectRatio: false, scales: { y: { beginAtZero: true, max: 300 } } }
                    });
                }
            }, [mocks]);

            return (
                <div className="space-y-6 animate-fade-in">
                    <h1 className="text-2xl font-bold">Mock Test Analytics</h1>
                    
                    <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                        <div className="lg:col-span-1 bg-white dark:bg-gray-800 p-6 rounded-xl border border-gray-200 dark:border-gray-700 h-fit">
                            <h2 className="font-bold mb-4">Add Test Score</h2>
                            <form onSubmit={handleSubmit} className="space-y-3">
                                <input required type="text" placeholder="Test Name (e.g., Allen Mock 1)" value={form.name} onChange={e => setForm({...form, name: e.target.value})} className="p-2.5 border rounded-lg dark:bg-gray-700 dark:border-gray-600 w-full text-sm" />
                                <div className="grid grid-cols-3 gap-2">
                                    <input required type="number" min="0" max="100" placeholder="Phy (100)" value={form.physics} onChange={e => setForm({...form, physics: e.target.value})} className="p-2.5 border rounded-lg dark:bg-gray-700 dark:border-gray-600 w-full text-sm" />
                                    <input required type="number" min="0" max="100" placeholder="Chem (100)" value={form.chemistry} onChange={e => setForm({...form, chemistry: e.target.value})} className="p-2.5 border rounded-lg dark:bg-gray-700 dark:border-gray-600 w-full text-sm" />
                                    <input required type="number" min="0" max="100" placeholder="Math (100)" value={form.maths} onChange={e => setForm({...form, maths: e.target.value})} className="p-2.5 border rounded-lg dark:bg-gray-700 dark:border-gray-600 w-full text-sm" />
                                </div>
                                <button type="submit" className="w-full bg-royal text-white py-2.5 rounded-lg font-bold text-sm hover:bg-blue-700">Save Score</button>
                            </form>
                        </div>

                        <div className="lg:col-span-2 space-y-6">
                            <div className="bg-white dark:bg-gray-800 p-4 rounded-xl border border-gray-200 dark:border-gray-700 h-64 relative">
                                {mocks.length === 0 ? (
                                    <div className="flex items-center justify-center h-full text-gray-500 text-sm">Add scores to see your progress trend.</div>
                                ) : <canvas ref={chartRef}></canvas>}
                            </div>
                            
                            <div className="bg-white dark:bg-gray-800 rounded-xl border border-gray-200 dark:border-gray-700 overflow-hidden overflow-x-auto">
                                <table className="w-full text-left text-sm min-w-[400px]">
                                    <thead className="bg-gray-50 dark:bg-gray-700/50">
                                        <tr>
                                            <th className="px-4 py-3 font-semibold">Test</th>
                                            <th className="px-4 py-3 font-semibold text-royal">Phy</th>
                                            <th className="px-4 py-3 font-semibold text-chem">Chem</th>
                                            <th className="px-4 py-3 font-semibold text-math">Math</th>
                                            <th className="px-4 py-3 font-semibold text-right">Total</th>
                                        </tr>
                                    </thead>
                                    <tbody className="divide-y divide-gray-100 dark:divide-gray-700">
                                        {mocks.map(m => (
                                            <tr key={m.id} className="hover:bg-gray-50 dark:hover:bg-gray-700/30">
                                                <td className="px-4 py-3 font-medium">{m.name}</td>
                                                <td className="px-4 py-3">{m.physics}</td>
                                                <td className="px-4 py-3">{m.chemistry}</td>
                                                <td className="px-4 py-3">{m.maths}</td>
                                                <td className="px-4 py-3 text-right font-bold text-royal dark:text-blue-400">{m.total}/300</td>
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        // 8. Pomodoro Timer
        const StudyTimer = () => {
            const [timeLeft, setTimeLeft] = useState(25 * 60);
            const [isActive, setIsActive] = useState(false);
            const [mode, setMode] = useState('focus'); 
            const [subject, setSubject] = useState('Physics');

            useEffect(() => {
                let interval = null;
                if (isActive && timeLeft > 0) {
                    interval = setInterval(() => setTimeLeft(timeLeft - 1), 1000);
                } else if (timeLeft === 0) {
                    setIsActive(false);
                    // Simple beep sound simulation
                    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                    const oscillator = audioCtx.createOscillator();
                    oscillator.type = 'sine';
                    oscillator.frequency.setValueAtTime(440, audioCtx.currentTime);
                    oscillator.connect(audioCtx.destination);
                    oscillator.start();
                    oscillator.stop(audioCtx.currentTime + 0.5);
                }
                return () => clearInterval(interval);
            }, [isActive, timeLeft]);

            const toggleTimer = () => setIsActive(!isActive);
            const resetTimer = () => { setIsActive(false); setTimeLeft(mode === 'focus' ? 25*60 : 5*60); };
            const changeMode = (newMode) => { setMode(newMode); setIsActive(false); setTimeLeft(newMode === 'focus' ? 25 * 60 : 5 * 60); };
            const formatTime = (seconds) => `${Math.floor(seconds / 60).toString().padStart(2, '0')}:${(seconds % 60).toString().padStart(2, '0')}`;

            return (
                <div className="flex flex-col items-center justify-center py-10 animate-fade-in">
                    <div className="bg-white dark:bg-gray-800 p-8 sm:p-10 rounded-3xl shadow-xl border border-gray-100 dark:border-gray-700 w-full max-w-md text-center">
                        <div className="flex justify-center gap-2 mb-10 bg-gray-100 dark:bg-gray-700 p-1 rounded-full w-fit mx-auto">
                            <button onClick={() => changeMode('focus')} className={`px-6 py-2 rounded-full font-bold text-sm transition-all ${mode === 'focus' ? 'bg-white shadow text-royal dark:bg-gray-800 dark:text-blue-400' : 'text-gray-500 hover:text-gray-700 dark:text-gray-400'}`}>Focus</button>
                            <button onClick={() => changeMode('shortBreak')} className={`px-6 py-2 rounded-full font-bold text-sm transition-all ${mode === 'shortBreak' ? 'bg-white shadow text-green-600 dark:bg-gray-800 dark:text-green-400' : 'text-gray-500 hover:text-gray-700 dark:text-gray-400'}`}>Break</button>
                        </div>
                        
                        <div className={`text-7xl sm:text-8xl font-extrabold tracking-tight mb-8 font-mono ${isActive ? (mode === 'focus' ? 'text-royal' : 'text-green-500') : 'text-gray-800 dark:text-white'}`}>
                            {formatTime(timeLeft)}
                        </div>

                        <div className="mb-10">
                            <select value={subject} onChange={(e) => setSubject(e.target.value)} className="bg-gray-50 border border-gray-200 text-gray-900 text-sm rounded-lg focus:ring-royal focus:border-royal block w-full p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white font-medium">
                                <option value="Physics">Physics</option>
                                <option value="Chemistry">Chemistry</option>
                                <option value="Mathematics">Mathematics</option>
                                <option value="Revision">Revision / PYQs</option>
                            </select>
                        </div>

                        <div className="flex justify-center gap-4">
                            <button onClick={toggleTimer} className={`w-full py-4 rounded-xl font-bold text-lg shadow-lg transition-all transform hover:scale-105 active:scale-95 ${isActive ? 'bg-orange-500 hover:bg-orange-600 text-white shadow-orange-500/30' : 'bg-royal hover:bg-blue-700 text-white shadow-royal/30'}`}>
                                {isActive ? 'Pause Timer' : 'Start Focus'}
                            </button>
                            <button onClick={resetTimer} className="w-1/3 py-4 rounded-xl font-bold text-lg bg-gray-100 hover:bg-gray-200 text-gray-700 dark:bg-gray-700 dark:text-gray-200 dark:hover:bg-gray-600 transition-colors">
                                Reset
                            </button>
                        </div>
                    </div>
                </div>
            );
        };

        // --- APP COMPONENT ---
        const App = () => {
            const [activeTab, setActiveTab] = useState('dashboard');
            const [isDark, setIsDark] = useLocalStorage('jee_darkMode_v2', false);
            
            // Initialize Data
            const defaultChapters = () => {
                const chaps = { physics: {}, chemistry: {}, maths: {} };
                SYLLABUS_DATA.physics.forEach(c => chaps.physics[c] = { name: c, completed: false, theory: 0, pyq: 0, priority: 'High' });
                SYLLABUS_DATA.chemistry.forEach(c => chaps.chemistry[c] = { name: c, completed: false, theory: 0, pyq: 0, priority: 'High' });
                SYLLABUS_DATA.maths.forEach(c => chaps.maths[c] = { name: c, completed: false, theory: 0, pyq: 0, priority: 'High' });
                return chaps;
            };

            const [settings, setSettings] = useLocalStorage('jee_settings_v2', { targetDate: '2027-01-24', dailyGoal: 5, targetPercentile: 99 });
            const [plan, setPlan] = useLocalStorage('jee_plan_v2', generatePlan());
            const [chapters, setChapters] = useLocalStorage('jee_chapters_v2', defaultChapters());
            const [mistakes, setMistakes] = useLocalStorage('jee_mistakes_v2', []);
            const [mocks, setMocks] = useLocalStorage('jee_mocks_v2', []);

            // Apply Dark Mode
            useEffect(() => {
                if (isDark) document.documentElement.classList.add('dark');
                else document.documentElement.classList.remove('dark');
                lucide.createIcons();
            }, [isDark, activeTab]);

            const toggleDark = () => setIsDark(!isDark);

            // Toggle individual subject task on Dashboard
            const toggleTask = (day, subject) => {
                setPlan(prev => {
                    const newPlan = { ...prev };
                    const dayData = { ...newPlan[day] };
                    
                    // Fallback if tasks don't exist yet
                    if (!dayData.tasks) dayData.tasks = { physics: false, chemistry: false, maths: false };
                    
                    dayData.tasks[subject] = !dayData.tasks[subject];
                    
                    // If all 3 are true, we could auto-mark as completed, but we'll let user click the button
                    newPlan[day] = dayData;
                    return newPlan;
                });
            };

            // Complete the day and move to the next
            const completeDay = (day) => {
                setPlan(prev => ({ ...prev, [day]: { ...prev[day], status: 'completed' } }));
                // Optional: scroll to top to show the next day
                window.scrollTo({ top: 0, behavior: 'smooth' });
            };

            const updatePlanStatus = (day, status) => {
                setPlan(prev => ({ ...prev, [day]: { ...prev[day], status } }));
            };

            const updateChapter = (subject, chapterId, field, value) => {
                setChapters(prev => ({
                    ...prev,
                    [subject]: { ...prev[subject], [chapterId]: { ...prev[subject][chapterId], [field]: value } }
                }));
            };

            return (
                <div className="min-h-screen pb-20">
                    <Header activeTab={activeTab} setActiveTab={setActiveTab} isDark={isDark} toggleDark={toggleDark} />
                    
                    <main className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
                        {activeTab === 'dashboard' && (
                            <Dashboard 
                                plan={plan} 
                                chapters={chapters} 
                                settings={settings} 
                                toggleTask={toggleTask} 
                                completeDay={completeDay}
                                setActiveTab={setActiveTab} 
                            />
                        )}
                        {activeTab === 'calendar' && <CalendarView plan={plan} updatePlanStatus={updatePlanStatus} />}
                        {activeTab === 'syllabus' && <SyllabusView chapters={chapters} updateChapter={updateChapter} />}
                        {activeTab === 'revision' && <RevisionTracker mistakes={mistakes} addMistake={m => setMistakes([m, ...mistakes])} resolveMistake={id => setMistakes(mistakes.map(x => x.id === id ? {...x, resolved: true} : x))} />}
                        {activeTab === 'mocks' && <MockTests mocks={mocks} addMock={m => setMocks([...mocks, m])} />}
                        {activeTab === 'timer' && <StudyTimer />}
                    </main>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
