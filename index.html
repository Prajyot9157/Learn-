<!DOCTYPE html>
<html lang="en" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MHT-CET 2027 4-Month Study Planner</title>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        navy: '#0b1a40',
                        royal: '#1c58c4',
                        chem: '#1c8144',
                        math: '#592e83',
                    },
                    animation: {
                        'fade-in-up': 'fadeInUp 0.5s ease-out forwards',
                        'pop-in': 'popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards',
                        'pulse-glow': 'pulseGlow 2s infinite',
                    },
                    keyframes: {
                        fadeInUp: {
                            '0%': { opacity: '0', transform: 'translateY(20px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' },
                        },
                        popIn: {
                            '0%': { transform: 'scale(0.8)', opacity: '0' },
                            '100%': { transform: 'scale(1)', opacity: '1' },
                        },
                        pulseGlow: {
                            '0%, 100%': { boxShadow: '0 0 0 0 rgba(28, 88, 196, 0.4)' },
                            '50%': { boxShadow: '0 0 0 10px rgba(28, 88, 196, 0)' },
                        }
                    }
                }
            }
        }
    </script>

    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Lucide Icons & Chart.js -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .dark ::-webkit-scrollbar-thumb { background: #475569; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        /* Confetti */
        .confetti-piece {
            position: absolute; width: 10px; height: 10px; background: #f2d74e;
            top: 50%; left: 50%; opacity: 0; pointer-events: none;
        }
        .confetti-piece:nth-child(1) { background: #ca3c66; transform: translate(-50%, -50%) rotate(15deg); animation: confetti-burst 1.2s ease-out forwards; }
        .confetti-piece:nth-child(2) { background: #69c9d0; transform: translate(-50%, -50%) rotate(45deg); animation: confetti-burst 1.2s ease-out forwards; animation-delay: 0.1s; }
        .confetti-piece:nth-child(3) { background: #f2d74e; transform: translate(-50%, -50%) rotate(80deg); animation: confetti-burst 1.2s ease-out forwards; animation-delay: 0.2s; }
        .confetti-piece:nth-child(4) { background: #ca3c66; transform: translate(-50%, -50%) rotate(120deg); animation: confetti-burst 1.2s ease-out forwards; }
        .confetti-piece:nth-child(5) { background: #69c9d0; transform: translate(-50%, -50%) rotate(160deg); animation: confetti-burst 1.2s ease-out forwards; animation-delay: 0.1s; }
        
        @keyframes confetti-burst {
            0% { opacity: 1; top: 50%; left: 50%; }
            100% { opacity: 0; top: -50%; left: calc(50% + (var(--x, 1) * 150px)); }
        }
    </style>
</head>
<body class="bg-gray-50 dark:bg-gray-900 text-gray-800 dark:text-gray-100 transition-colors duration-300 font-sans">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;

        // --- DATA (MHT CET Syllabus with Difficulty/Priority) ---
        const SYLLABUS_DATA = {
            physics: [
                { name: "Units and Measurements", priority: "Low", difficulty: "Basic" },
                { name: "Kinematics", priority: "High", difficulty: "Intermediate" },
                { name: "Laws of Motion", priority: "High", difficulty: "Intermediate" },
                { name: "Work Energy and Power", priority: "High", difficulty: "Basic" },
                { name: "Rotational Motion", priority: "High", difficulty: "Advanced" },
                { name: "Gravitation", priority: "Medium", difficulty: "Basic" },
                { name: "Properties of Solids and Liquids", priority: "Medium", difficulty: "Intermediate" },
                { name: "Thermodynamics", priority: "High", difficulty: "Advanced" },
                { name: "Kinetic Theory of Gases", priority: "Medium", difficulty: "Intermediate" },
                { name: "Oscillations and Waves", priority: "High", difficulty: "Advanced" },
                { name: "Electrostatics", priority: "High", difficulty: "Intermediate" },
                { name: "Current Electricity", priority: "High", difficulty: "Intermediate" },
                { name: "Magnetism", priority: "Medium", difficulty: "Advanced" },
                { name: "Electromagnetic Induction and AC", priority: "Medium", difficulty: "Advanced" },
                { name: "Electromagnetic Waves", priority: "Low", difficulty: "Basic" },
                { name: "Optics", priority: "High", difficulty: "Intermediate" },
                { name: "Dual Nature of Matter", priority: "Medium", difficulty: "Basic" },
                { name: "Atoms and Nuclei", priority: "Medium", difficulty: "Basic" },
                { name: "Semiconductor Devices", priority: "High", difficulty: "Basic" },
                { name: "Experimental Skills", priority: "Low", difficulty: "Basic" }
            ],
            chemistry: [
                { name: "Some Basic Concepts", priority: "High", difficulty: "Basic" },
                { name: "Atomic Structure", priority: "High", difficulty: "Basic" },
                { name: "Chemical Bonding", priority: "High", difficulty: "Intermediate" },
                { name: "Chemical Thermodynamics", priority: "High", difficulty: "Advanced" },
                { name: "Solutions", priority: "Medium", difficulty: "Intermediate" },
                { name: "Equilibrium", priority: "High", difficulty: "Advanced" },
                { name: "Redox Reactions and Electrochemistry", priority: "High", difficulty: "Advanced" },
                { name: "Chemical Kinetics", priority: "Medium", difficulty: "Intermediate" },
                { name: "Classification of Elements", priority: "Medium", difficulty: "Basic" },
                { name: "p-Block Elements", priority: "High", difficulty: "Intermediate" },
                { name: "d- and f-Block Elements", priority: "Medium", difficulty: "Intermediate" },
                { name: "Coordination Compounds", priority: "High", difficulty: "Advanced" },
                { name: "Purification and Characterisation", priority: "Low", difficulty: "Basic" },
                { name: "General Organic Chemistry", priority: "High", difficulty: "Advanced" },
                { name: "Hydrocarbons", priority: "High", difficulty: "Intermediate" },
                { name: "Halogen Derivatives", priority: "Medium", difficulty: "Intermediate" },
                { name: "Oxygen-containing Organics", priority: "High", difficulty: "Advanced" },
                { name: "Nitrogen-containing Organics", priority: "Medium", difficulty: "Advanced" },
                { name: "Biomolecules", priority: "Low", difficulty: "Basic" },
                { name: "Practical Chemistry", priority: "Low", difficulty: "Basic" }
            ],
            maths: [
                { name: "Mathematical Logic", priority: "Medium", difficulty: "Basic" },
                { name: "Matrices", priority: "High", difficulty: "Basic" },
                { name: "Trigonometric Functions", priority: "High", difficulty: "Intermediate" },
                { name: "Pair of Straight Lines", priority: "High", difficulty: "Advanced" },
                { name: "Vectors", priority: "High", difficulty: "Intermediate" },
                { name: "Three Dimensional Geometry", priority: "High", difficulty: "Advanced" },
                { name: "Linear Programming", priority: "Medium", difficulty: "Basic" },
                { name: "Differentiation", priority: "High", difficulty: "Intermediate" },
                { name: "Applications of Derivatives", priority: "High", difficulty: "Advanced" },
                { name: "Integration", priority: "High", difficulty: "Advanced" },
                { name: "Definite Integration", priority: "High", difficulty: "Advanced" },
                { name: "Applications of Definite Integration", priority: "Medium", difficulty: "Intermediate" },
                { name: "Differential Equations", priority: "High", difficulty: "Advanced" },
                { name: "Probability Distributions", priority: "Medium", difficulty: "Intermediate" },
                { name: "Binomial Distribution", priority: "Medium", difficulty: "Basic" },
                { name: "Complex Numbers", priority: "High", difficulty: "Intermediate" },
                { name: "Sequences and Series", priority: "High", difficulty: "Intermediate" },
                { name: "Permutations and Combinations", priority: "High", difficulty: "Basic" }
            ]
        };

        // Generate 120-day plan starting from Oct 25, 2026 to Mar 2027
        const generatePlan = () => {
            const plan = {};
            const pList = SYLLABUS_DATA.physics;
            const cList = SYLLABUS_DATA.chemistry;
            const mList = SYLLABUS_DATA.maths;

            for (let i = 1; i <= 120; i++) {
                let phase = "";
                if (i <= 35) phase = "Phase 1: Foundation";
                else if (i <= 70) phase = "Phase 2: Syllabus Coverage";
                else if (i <= 95) phase = "Phase 3: Completion & Practice";
                else phase = "Phase 4: Revision & Testing";

                // Determine chapter based on day
                let pChap, cChap, mChap;
                if (i <= 95) {
                    // Covering syllabus (Spread 20 chapters over 95 days -> ~4.5 days per chapter)
                    pChap = pList[Math.min(Math.floor((i-1) / 4.5), pList.length - 1)];
                    cChap = cList[Math.min(Math.floor((i-1) / 4.5), cList.length - 1)];
                    mChap = mList[Math.min(Math.floor((i-1) / 5), mList.length - 1)];
                } else {
                    // Revision phase - cycle through chapters
                    pChap = pList[(i - 96) % pList.length];
                    cChap = cList[(i - 96) % cList.length];
                    mChap = mList[(i - 96) % mList.length];
                }

                // Target generation
                let targetStr = "";
                if (i <= 35) targetStr = "Theory + Solved Examples + 10 MCQs";
                else if (i <= 70) targetStr = "Advance Theory + 15 MCQs + 5 PYQs";
                else if (i <= 95) targetStr = "Finish Chapter + 20 MCQs + 10 PYQs";
                else targetStr = "Formula Revision + Full Chapter Test";

                plan[i] = { 
                    day: i,
                    phase,
                    physics: { name: pChap.name, target: targetStr },
                    chemistry: { name: cChap.name, target: targetStr },
                    maths: { name: mChap.name, target: targetStr },
                    status: "pending", 
                    tasks: { physics: false, chemistry: false, maths: false },
                    studyHours: 0
                };
            }
            return plan;
        };

        // --- UTILITIES ---
        const useLocalStorage = (key, initialValue) => {
            const [storedValue, setStoredValue] = useState(() => {
                try {
                    const item = window.localStorage.getItem(key);
                    return item ? JSON.parse(item) : initialValue;
                } catch (error) { return initialValue; }
            });
            const setValue = (value) => {
                try {
                    const valueToStore = value instanceof Function ? value(storedValue) : value;
                    setStoredValue(valueToStore);
                    window.localStorage.setItem(key, JSON.stringify(valueToStore));
                } catch (error) { console.error(error); }
            };
            return [storedValue, setValue];
        };

        // --- COMPONENTS ---
        
        // 1. Header
        const Header = ({ activeTab, setActiveTab, isDark, toggleDark }) => {
            const tabs = [
                { id: 'dashboard', label: 'Dashboard', icon: 'LayoutDashboard' },
                { id: 'calendar', label: 'Plan (120 Days)', icon: 'Calendar' },
                { id: 'syllabus', label: 'Syllabus', icon: 'BookOpen' },
                { id: 'revision', label: 'Mistakes', icon: 'AlertCircle' },
                { id: 'mocks', label: 'Mocks', icon: 'BarChart2' },
                { id: 'timer', label: 'Timer', icon: 'Timer' },
                { id: 'settings', label: 'Settings', icon: 'Settings' },
            ];

            return (
                <nav className="bg-white/90 dark:bg-gray-800/90 backdrop-blur-md shadow-sm sticky top-0 z-50 border-b border-gray-100 dark:border-gray-700 transition-colors duration-300">
                    <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                        <div className="flex justify-between h-16">
                            <div className="flex items-center cursor-pointer group" onClick={() => setActiveTab('dashboard')}>
                                <span className="text-xl font-extrabold text-navy dark:text-white flex items-center gap-2 tracking-tight">
                                    <div className="bg-royal text-white p-1.5 rounded-lg group-hover:rotate-12 transition-transform duration-300">
                                        <i data-lucide="target" size={20}></i>
                                    </div>
                                    MHT CET <span className="text-royal dark:text-blue-400">2027</span>
                                </span>
                            </div>
                            <div className="hidden lg:flex items-center space-x-1">
                                {tabs.map(tab => (
                                    <button key={tab.id} onClick={() => setActiveTab(tab.id)}
                                        className={`px-3 py-2 rounded-lg text-sm font-semibold flex items-center gap-2 transition-all duration-200 ${
                                            activeTab === tab.id ? 'bg-blue-50 text-royal dark:bg-gray-700 dark:text-blue-400 shadow-sm' : 'text-gray-500 hover:bg-gray-100 dark:text-gray-400 dark:hover:bg-gray-700'
                                        }`}>
                                        <i data-lucide={tab.icon} size={16}></i> {tab.label}
                                    </button>
                                ))}
                                <div className="w-px h-6 bg-gray-200 dark:bg-gray-700 mx-2"></div>
                                <button onClick={toggleDark} className="p-2 text-gray-500 hover:bg-gray-100 rounded-full dark:text-gray-300 dark:hover:bg-gray-700 transition-all duration-300 hover:rotate-12">
                                    <i data-lucide={isDark ? 'Sun' : 'Moon'} size={20}></i>
                                </button>
                            </div>
                        </div>
                    </div>
                    {/* Mobile Nav */}
                    <div className="lg:hidden flex overflow-x-auto px-2 py-2 border-t border-gray-100 dark:border-gray-700 no-scrollbar bg-white dark:bg-gray-800">
                        {tabs.map(tab => (
                            <button key={tab.id} onClick={() => setActiveTab(tab.id)}
                                className={`flex-shrink-0 px-3 py-1.5 rounded-full text-xs font-semibold flex items-center gap-1.5 mx-1 transition-all ${
                                    activeTab === tab.id ? 'bg-royal text-white shadow-md' : 'text-gray-600 bg-gray-100 dark:bg-gray-700 dark:text-gray-300'
                                }`}>
                                <i data-lucide={tab.icon} size={14}></i> {tab.label}
                            </button>
                        ))}
                        <button onClick={toggleDark} className="flex-shrink-0 px-3 py-1.5 rounded-full text-xs font-semibold flex items-center gap-1 mx-1 text-gray-600 bg-gray-100 dark:bg-gray-700 dark:text-gray-300">
                            <i data-lucide={isDark ? 'Sun' : 'Moon'} size={14}></i> Theme
                        </button>
                    </div>
                </nav>
            );
        };

        // 2. Action Task Card
        const ActionTaskCard = ({ subject, data, isCompleted, onToggle, index }) => {
            const styles = {
                physics: { color: 'text-royal', bg: 'bg-blue-50 dark:bg-blue-900/20', border: 'border-blue-200 dark:border-blue-800', icon: 'Atom' },
                chemistry: { color: 'text-chem', bg: 'bg-green-50 dark:bg-green-900/20', border: 'border-green-200 dark:border-green-800', icon: 'FlaskConical' },
                maths: { color: 'text-math', bg: 'bg-purple-50 dark:bg-purple-900/20', border: 'border-purple-200 dark:border-purple-800', icon: 'Calculator' },
            }[subject];

            return (
                <div onClick={onToggle} style={{ animationDelay: `${index * 100}ms` }}
                    className={`cursor-pointer group relative overflow-hidden rounded-2xl p-5 border-2 transition-all duration-300 animate-fade-in-up ${
                        isCompleted ? 'bg-gray-50 border-gray-200 dark:bg-gray-800/50 dark:border-gray-700' : `${styles.bg} ${styles.border} hover:shadow-lg hover:-translate-y-1`
                    }`}>
                    <div className="flex items-start justify-between mb-2">
                        <div className={`p-2 rounded-xl bg-white dark:bg-gray-800 shadow-sm transition-transform duration-300 group-hover:scale-110 ${styles.color}`}>
                            <i data-lucide={styles.icon} size={24}></i>
                        </div>
                        <div className={`w-8 h-8 rounded-full border-2 flex items-center justify-center transition-all duration-300 ${
                            isCompleted ? 'bg-green-500 border-green-500 text-white scale-110' : 'border-gray-300 text-transparent group-hover:border-gray-400 bg-white dark:bg-gray-800 scale-100'
                        }`}>
                            <i data-lucide="check" size={18} className={`transition-transform duration-300 ${isCompleted ? 'scale-100' : 'scale-0'}`}></i>
                        </div>
                    </div>
                    <div>
                        <div className="flex justify-between items-center mb-1">
                            <p className={`text-xs font-bold uppercase tracking-wider ${isCompleted ? 'text-gray-400' : styles.color}`}>{subject}</p>
                            {data.priority && <span className={`text-[10px] px-1.5 py-0.5 rounded font-bold ${data.priority === 'High' ? 'bg-red-100 text-red-700 dark:bg-red-900/30' : 'bg-gray-200 text-gray-700 dark:bg-gray-700'}`}>{data.priority}</span>}
                        </div>
                        <h3 className={`text-lg font-bold leading-tight transition-all duration-300 ${isCompleted ? 'line-through text-gray-400' : 'text-gray-800 dark:text-white'}`}>{data.name}</h3>
                        <p className={`text-xs mt-2 font-medium ${isCompleted ? 'text-gray-400' : 'text-gray-600 dark:text-gray-300'}`}>{data.target}</p>
                    </div>
                </div>
            );
        };

        // 3. Dashboard
        const Dashboard = ({ plan, chapters, settings, toggleTask, completeDay, setActiveTab, updateStudyHours }) => {
            const [showConfetti, setShowConfetti] = useState(false);
            const [hoursInput, setHoursInput] = useState("");

            // Calculate current day based on date
            const startDate = new Date('2026-10-25');
            const today = new Date();
            // Reset time for accurate diff
            startDate.setHours(0,0,0,0); today.setHours(0,0,0,0);
            const diffDays = Math.floor((today - startDate) / (1000 * 60 * 60 * 24));
            
            let currentDayNum = Math.max(1, diffDays + 1);
            let isPlanCompleted = false;
            
            if (currentDayNum > 120) {
                currentDayNum = 120;
                isPlanCompleted = plan[120]?.status === 'completed';
            }

            const currentDay = plan[currentDayNum] || plan[1];
            const tasks = currentDay?.tasks || { physics: false, chemistry: false, maths: false };
            const completedTasksCount = Object.values(tasks).filter(Boolean).length;
            const isDayFullyDone = completedTasksCount === 3;

            const daysLeft = Math.max(0, Math.ceil((new Date(settings.targetDate) - today) / (1000 * 60 * 60 * 24)));

            // Check for missed days
            const missedDays = [];
            for (let i = 1; i < currentDayNum; i++) {
                if (plan[i] && plan[i].status !== 'completed' && plan[i].status !== 'missed') {
                    missedDays.push(i);
                }
            }

            const handleCompleteDay = () => {
                setShowConfetti(true);
                setTimeout(() => {
                    completeDay(currentDayNum);
                    setShowConfetti(false);
                }, 1000);
            };

            const handleLogHours = (e) => {
                e.preventDefault();
                if(hoursInput > 0) {
                    updateStudyHours(currentDayNum, parseFloat(hoursInput));
                    setHoursInput("");
                }
            };

            const handleSkipMissed = () => {
                // Mark previous missed days as 'missed' so they stop showing up
                const newPlan = { ...plan };
                missedDays.forEach(d => { newPlan[d].status = 'missed'; });
                // force update (localStorage will catch it)
                completeDay(currentDayNum - 1); 
            }

            if (isPlanCompleted) {
                return (
                    <div className="flex flex-col items-center justify-center h-[70vh] animate-fade-in-up">
                        <div className="text-6xl mb-4">🎉</div>
                        <h1 className="text-3xl font-extrabold text-green-500 mb-2">Plan Completed!</h1>
                        <p className="text-gray-500">You have successfully completed the 120-day MHT-CET preparation plan.</p>
                        <button onClick={() => setActiveTab('mocks')} className="mt-6 bg-royal text-white px-6 py-2 rounded-lg font-bold">Check Mock Progress</button>
                    </div>
                );
            }

            return (
                <div className="space-y-8 pb-10 relative">
                    {showConfetti && (
                        <div className="fixed inset-0 pointer-events-none z-50 flex items-center justify-center overflow-hidden">
                            {[...Array(20)].map((_, i) => <div key={i} className="confetti-piece" style={{ '--x': Math.random() * 20 - 10 }}></div>)}
                            <div className="absolute text-green-500 animate-pop-in bg-white px-8 py-4 rounded-full shadow-2xl font-bold text-2xl flex items-center gap-2"><i data-lucide="party-popper"></i> Day Completed!</div>
                        </div>
                    )}

                    {/* Missed Day Recovery Banner */}
                    {missedDays.length > 0 && (
                        <div className="bg-orange-50 dark:bg-orange-900/20 border-l-4 border-orange-500 p-4 rounded-r-xl shadow-sm animate-fade-in-up flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
                            <div>
                                <h3 className="font-bold text-orange-800 dark:text-orange-300 flex items-center gap-2"><i data-lucide="alert-triangle" size={18}></i> You are behind schedule</h3>
                                <p className="text-sm text-orange-700 dark:text-orange-400 mt-1">You have {missedDays.length} pending days from the past. Do you want to catch up or skip them?</p>
                            </div>
                            <div className="flex gap-2 w-full sm:w-auto">
                                <button onClick={() => setActiveTab('calendar')} className="flex-1 sm:flex-none bg-white border border-orange-300 text-orange-700 px-4 py-2 rounded-lg text-sm font-bold hover:bg-orange-100 transition-colors">Catch Up</button>
                                <button onClick={handleSkipMissed} className="flex-1 sm:flex-none bg-orange-500 text-white px-4 py-2 rounded-lg text-sm font-bold hover:bg-orange-600 transition-colors">Skip to Today</button>
                            </div>
                        </div>
                    )}

                    {/* HERO */}
                    <div className="relative bg-navy rounded-3xl p-6 sm:p-10 shadow-2xl overflow-hidden border border-gray-800 animate-fade-in-up">
                        <div className="absolute top-0 right-0 -mr-20 -mt-20 w-64 h-64 bg-royal rounded-full blur-3xl opacity-20 animate-pulse"></div>
                        <div className="absolute bottom-0 left-0 -ml-20 -mb-20 w-64 h-64 bg-chem rounded-full blur-3xl opacity-10"></div>
                        
                        <div className="relative z-10">
                            <div className="flex flex-col md:flex-row justify-between items-start md:items-center mb-8 gap-4 border-b border-gray-700/50 pb-6">
                                <div>
                                    <div className="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-blue-500/20 text-blue-300 text-xs font-bold tracking-wide uppercase mb-3 border border-blue-500/30">
                                        <i data-lucide="zap" size={14} className="animate-pulse"></i> {currentDay.phase}
                                    </div>
                                    <h1 className="text-3xl sm:text-4xl font-extrabold text-white tracking-tight">Day {currentDayNum} Target</h1>
                                    <p className="text-gray-400 mt-2 text-sm sm:text-base">Tick off your targets below. Chemistry is prioritized for your weak areas.</p>
                                </div>
                                <div className="bg-gray-800/80 backdrop-blur-sm px-6 py-4 rounded-2xl border border-gray-700 text-center shadow-lg transform hover:scale-105 transition-transform">
                                    <p className="text-xs text-gray-400 uppercase tracking-wider mb-1">Days to Exam</p>
                                    <p className="text-3xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-green-400">{daysLeft}</p>
                                    <p className="text-[10px] text-gray-500 mt-1">Target: {settings.targetDate}</p>
                                </div>
                            </div>

                            <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                                <ActionTaskCard index={0} subject="physics" data={currentDay.physics} isCompleted={tasks.physics} onToggle={() => toggleTask(currentDayNum, 'physics')} />
                                <ActionTaskCard index={1} subject="chemistry" data={currentDay.chemistry} isCompleted={tasks.chemistry} onToggle={() => toggleTask(currentDayNum, 'chemistry')} />
                                <ActionTaskCard index={2} subject="maths" data={currentDay.maths} isCompleted={tasks.maths} onToggle={() => toggleTask(currentDayNum, 'maths')} />
                            </div>

                            {/* Action Bar */}
                            <div className="mt-8 flex flex-col lg:flex-row items-center justify-between gap-4 bg-gray-800/50 p-4 rounded-xl border border-gray-700/50">

        // 5. Calendar View

            const [form, setForm] = useState({ chapter: '', mistake: '', concept: '' });
            const handleSubmit = (e) => {
                e.preventDefault();
                if(!form.chapter || !form.mistake) return;
                addMistake({ ...form, id: Date.now(), resolved: false, date: new Date().toISOString() });
                setForm({ chapter: '', mistake: '', concept: '' });
            };

            return (
                <div className="space-y-6 animate-fade-in-up">

            const [form, setForm] = useState({ name: '', physics: '', chemistry: '', maths: '' });
            const chartRef = useRef(null);
            const chartInstance = useRef(null);

            const maxTotal = (settings.phyMax || 50) + (settings.chemMax || 50) + (settings.mathMax || 100);

            const handleSubmit = (e) => {
                e.preventDefault();
                const p = parseInt(form.physics) || 0;
                const c = parseInt(form.chemistry) || 0;
                const m = parseInt(form.maths) || 0;
                addMock({ ...form, id: Date.now(), total: p+c+m, date: new Date().toLocaleDateString() });
                setForm({ name: '', physics: '', chemistry: '', maths: '' });

                if (chartRef.current && mocks.length > 0) {
                    if (chartInstance.current) chartInstance.current.destroy();
                    const ctx = chartRef.current.getContext('2d');
                    chartInstance.current = new Chart(ctx, {
                        type: 'line',
                        data: {

                                label: `MHT CET Score (Out of ${maxTotal})`,

                            <div>
                                <label className="block text-sm font-medium mb-1">Target Percentile</label>
                                <input type="number" value={settings.targetPercentile} onChange={(e) => updateSettings('targetPercentile', parseInt(e.target.value))} className="w-full p-2.5 border rounded-lg dark:bg-gray-700 dark:border-gray-600" />
                            </div>
                        </div>
                    </div>

                    <div className="bg-white dark:bg-gray-800 p-6 rounded-xl border border-gray-200 dark:border-gray-700 space-y-4 shadow-sm">
                        <h2 className="font-bold border-b pb-2 dark:border-gray-700">Mock Test Pattern</h2>
                        <p className="text-sm text-gray-500">Set the maximum marks for each subject. Default is Math (100), Phy (50), Chem (50) based on previous patterns.</p>
                        <div className="grid grid-cols-3 gap-4">
                            <div>
                                <label className="block text-sm font-medium mb-1">Physics Max</label>
                                <input type="number" value={settings.phyMax} onChange={(e) => updateSettings('phyMax', parseInt(e.target.value))} className="w-full p-2.5 border rounded-lg dark:bg-gray-700 dark:border-gray-600" />
                            </div>
                            <div>
                                <label className="block text-sm font-medium mb-1">Chemistry Max</label>
                                <input type="number" value={settings.chemMax} onChange={(e) => updateSettings('chemMax', parseInt(e.target.value))} className="w-full p-2.5 border rounded-lg dark:bg-gray-700 dark:border-gray-600" />
                            </div>
                            <div>
                                <label className="block text-sm font-medium mb-1">Maths Max</label>
                                <input type="number" value={settings.mathMax} onChange={(e) => updateSettings('mathMax', parseInt(e.target.value))} className="w-full p-2.5 border rounded-lg dark:bg-gray-700 dark:border-gray-600" />
                            </div>
                        </div>
                    </div>

                    <div className="bg-white dark:bg-gray-800 p-6 rounded-xl border border-gray-200 dark:border-gray-700 space-y-4 shadow-sm">
                        <h2 className="font-bold border-b pb-2 dark:border-gray-700">Backup & Restore</h2>
                        <div className="flex flex-col sm:flex-row gap-4">
                            <button onClick={exportData} className="flex-1 bg-blue-100 text-blue-700 hover:bg-blue-200 px-4 py-3 rounded-lg font-bold transition-colors flex items-center justify-center gap-2">
                                <i data-lucide="download"></i> Export Data (JSON)
                            </button>
                            <button onClick={() => fileInputRef.current.click()} className="flex-1 bg-green-100 text-green-700 hover:bg-green-200 px-4 py-3 rounded-lg font-bold transition-colors flex items-center justify-center gap-2">
                                <i data-lucide="upload"></i> Import Data
                            </button>
                            <input type="file" ref={fileInputRef} onChange={importData} accept=".json" className="hidden" />
                        </div>
                        <p className="text-xs text-gray-500 text-center">Use this to backup your progress before switching devices.</p>
                    </div>

                    <div className="bg-red-50 dark:bg-red-900/10 p-6 rounded-xl border border-red-200 dark:border-red-900/30">
                        <h2 className="text-lg font-bold text-red-700 dark:text-red-400 mb-2">Danger Zone</h2>
                        <p className="text-sm text-red-600 dark:text-red-300 mb-4">This will permanently delete all your progress, checked chapters, and logged mistakes.</p>
                        <button onClick={() => { if(window.confirm("Are you absolutely sure? This cannot be undone.")) resetApp(); }} className="bg-red-600 hover:bg-red-700 text-white px-4 py-2 rounded-lg font-bold transition-colors">Reset All Progress</button>
                    </div>
                </div>
            );
        };

        // 10. Timer
        const StudyTimer = () => {
            const [timeLeft, setTimeLeft] = useState(25 * 60);
            const [isActive, setIsActive] = useState(false);
            const [mode, setMode] = useState('focus'); 
            const [subject, setSubject] = useState('Chemistry');

            useEffect(() => {
                let interval = null;
                if (isActive && timeLeft > 0) {
                    interval = setInterval(() => setTimeLeft(timeLeft - 1), 1000);
                } else if (timeLeft === 0) {
                    setIsActive(false);
                    try {
                        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                        const oscillator = audioCtx.createOscillator();
                        oscillator.type = 'sine'; oscillator.frequency.setValueAtTime(440, audioCtx.currentTime);
                        oscillator.connect(audioCtx.destination); oscillator.start(); oscillator.stop(audioCtx.currentTime + 0.5);
                    } catch(e) {}
                }
                return () => clearInterval(interval);
            }, [isActive, timeLeft]);

            const toggleTimer = () => setIsActive(!isActive);
            const resetTimer = () => { setIsActive(false); setTimeLeft(mode === 'focus' ? 25*60 : 5*60); };
            const changeMode = (newMode) => { setMode(newMode); setIsActive(false); setTimeLeft(newMode === 'focus' ? 25 * 60 : 5 * 60); };
            const formatTime = (seconds) => `${Math.floor(seconds / 60).toString().padStart(2, '0')}:${(seconds % 60).toString().padStart(2, '0')}`;

            return (
                <div className="flex flex-col items-center justify-center py-10 animate-fade-in-up">
                    <div className="bg-white dark:bg-gray-800 p-8 sm:p-10 rounded-3xl shadow-xl border border-gray-100 dark:border-gray-700 w-full max-w-md text-center">
                        <div className="flex justify-center gap-2 mb-10 bg-gray-100 dark:bg-gray-700 p-1 rounded-full w-fit mx-auto">
                            <button onClick={() => changeMode('focus')} className={`px-6 py-2 rounded-full font-bold text-sm transition-all ${mode === 'focus' ? 'bg-white shadow text-royal dark:bg-gray-800 dark:text-blue-400 scale-105' : 'text-gray-500'}`}>Focus (25m)</button>
                            <button onClick={() => changeMode('shortBreak')} className={`px-6 py-2 rounded-full font-bold text-sm transition-all ${mode === 'shortBreak' ? 'bg-white shadow text-green-600 dark:bg-gray-800 dark:text-green-400 scale-105' : 'text-gray-500'}`}>Break (5m)</button>
                        </div>
                        <div className={`text-7xl sm:text-8xl font-extrabold tracking-tight mb-8 font-mono ${isActive ? (mode === 'focus' ? 'text-royal' : 'text-green-500') : 'text-gray-800 dark:text-white'}`}>
                            {formatTime(timeLeft)}
                        </div>
                        <div className="mb-10">
                            <select value={subject} onChange={(e) => setSubject(e.target.value)} className="bg-gray-50 border border-gray-200 text-gray-900 text-sm rounded-lg focus:ring-royal focus:border-royal block w-full p-3 dark:bg-gray-700 dark:border-gray-600 dark:text-white font-medium cursor-pointer">
                                <option value="Chemistry">Chemistry</option>
                                <option value="Physics">Physics</option>
                                <option value="Mathematics">Mathematics</option>
                                <option value="Revision">Revision / PYQs</option>
                            </select>
                        </div>
                        <div className="flex justify-center gap-4">
                            <button onClick={toggleTimer} className={`w-full py-4 rounded-xl font-bold text-lg shadow-lg transition-all transform hover:-translate-y-1 active:translate-y-0 ${isActive ? 'bg-orange-500 hover:bg-orange-600 text-white' : 'bg-royal hover:bg-blue-700 text-white'}`}>{isActive ? 'Pause' : 'Start Focus'}</button>
                            <button onClick={resetTimer} className="w-1/3 py-4 rounded-xl font-bold text-lg bg-gray-100 hover:bg-gray-200 text-gray-700 dark:bg-gray-700 dark:text-gray-200 transition-colors">Reset</button>
                        </div>
                    </div>
                </div>
            );
        };

        // --- APP COMPONENT ---
        const App = () => {
            const [activeTab, setActiveTab] = useState('dashboard');
            const [isDark, setIsDark] = useLocalStorage('mht4m_darkMode', false);
            
            const defaultChapters = () => {
                const chaps = { physics: {}, chemistry: {}, maths: {} };
                SYLLABUS_DATA.physics.forEach(c => chaps.physics[c.name] = { name: c.name, completed: false, theory: 0, pyq: 0, priority: c.priority, difficulty: c.difficulty });
                SYLLABUS_DATA.chemistry.forEach(c => chaps.chemistry[c.name] = { name: c.name, completed: false, theory: 0, pyq: 0, priority: c.priority, difficulty: c.difficulty });
                SYLLABUS_DATA.maths.forEach(c => chaps.maths[c.name] = { name: c.name, completed: false, theory: 0, pyq: 0, priority: c.priority, difficulty: c.difficulty });
                return chaps;
            };

            // Setting defaults
            const defaultSettings = { 
                targetDate: '2027-03-15', 
                targetPercentile: 99, 
                phyMax: 50, 
                chemMax: 50, 
                mathMax: 100 
            };

            const [settings, setSettings] = useLocalStorage('mht4m_settings', defaultSettings);
            const [plan, setPlan] = useLocalStorage('mht4m_plan', generatePlan());
            const [chapters, setChapters] = useLocalStorage('mht4m_chapters', defaultChapters());
            const [mistakes, setMistakes] = useLocalStorage('mht4m_mistakes', []);
            const [mocks, setMocks] = useLocalStorage('mht4m_mocks', []);

            useEffect(() => {
                if (isDark) document.documentElement.classList.add('dark');
                else document.documentElement.classList.remove('dark');
                lucide.createIcons();
            }, [isDark, activeTab]);

            const toggleDark = () => setIsDark(!isDark);

            const toggleTask = (day, subject) => {
                setPlan(prev => {
                    const newPlan = { ...prev };
                    const dayData = { ...newPlan[day] };
                    if (!dayData.tasks) dayData.tasks = { physics: false, chemistry: false, maths: false };
                    dayData.tasks[subject] = !dayData.tasks[subject];
                    newPlan[day] = dayData;
                    return newPlan;
                });
            };

            const completeDay = (day) => {
                setPlan(prev => ({ ...prev, [day]: { ...prev[day], status: 'completed' } }));
                window.scrollTo({ top: 0, behavior: 'smooth' });
            };

            const updateStudyHours = (day, hours) => {
                setPlan(prev => ({ 
                    ...prev, 
                    [day]: { ...prev[day], studyHours: (prev[day].studyHours || 0) + hours } 
                }));
            };

            const updatePlanStatus = (day, status) => {
                setPlan(prev => ({ ...prev, [day]: { ...prev[day], status } }));
            };

            const updateChapter = (subject, chapterId, field, value) => {
                setChapters(prev => ({
                    ...prev,
                    [subject]: { ...prev[subject], [chapterId]: { ...prev[subject][chapterId], [field]: value } }
                }));
            };

            const updateSettings = (key, value) => {
                setSettings(prev => ({ ...prev, [key]: value }));
            };

            // Export / Import
            const exportData = () => {
                const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify({ plan, chapters, mistakes, mocks, settings }));
                const downloadAnchorNode = document.createElement('a');
                downloadAnchorNode.setAttribute("href", dataStr);
                downloadAnchorNode.setAttribute("download", "mht_cet_2027_backup.json");
                document.body.appendChild(downloadAnchorNode);
                downloadAnchorNode.click();
                downloadAnchorNode.remove();
            };

            const importData = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (event) => {
                    try {
                        const parsed = JSON.parse(event.target.result);
                        if (parsed.plan && parsed.chapters) {
                            setPlan(parsed.plan);
                            setChapters(parsed.chapters);
                            if (parsed.mistakes) setMistakes(parsed.mistakes);
                            if (parsed.mocks) setMocks(parsed.mocks);
                            if (parsed.settings) setSettings(parsed.settings);
                            alert("Data imported successfully!");
                        } else {
                            alert("Invalid file format.");
                        }
                    } catch (err) {
                        alert("Error parsing file.");
                    }
                };
                reader.readAsText(file);
            };

            const resetApp = () => {
                localStorage.clear();
                window.location.reload();
            };

            return (
                <div className="min-h-screen pb-20">
                    <Header activeTab={activeTab} setActiveTab={setActiveTab} isDark={isDark} toggleDark={toggleDark} />
                    <main className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
                        {activeTab === 'dashboard' && <Dashboard plan={plan} chapters={chapters} settings={settings} toggleTask={toggleTask} completeDay={completeDay} updateStudyHours={updateStudyHours} setActiveTab={setActiveTab} />}
                        {activeTab === 'calendar' && <CalendarView plan={plan} updatePlanStatus={updatePlanStatus} />}
                        {activeTab === 'syllabus' && <SyllabusView chapters={chapters} updateChapter={updateChapter} />}
                        {activeTab === 'revision' && <RevisionTracker mistakes={mistakes} addMistake={m => setMistakes([m, ...mistakes])} resolveMistake={id => setMistakes(mistakes.map(x => x.id === id ? {...x, resolved: true} : x))} />}
                        {activeTab === 'mocks' && <MockTests mocks={mocks} addMock={m => setMocks([...mocks, m])} settings={settings} />}
                        {activeTab === 'timer' && <StudyTimer />}
                        {activeTab === 'settings' && <SettingsView settings={settings} updateSettings={updateSettings} exportData={exportData} importData={importData} resetApp={resetApp} />}
                    </main>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
